spring.application.name=dashboard-chamados

spring.datasource.url=jdbc:postgresql://localhost:5432/dashboard_chamados
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/dashboard_chamados}

spring.session.store-type=mongodb
spring.session.timeout=30m
spring.session.mongodb.collection-name=sessions

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@dashboard.local}
app.admin.password=${ADMIN_PASSWORD:TrocarSenha123!}

logging.level.org.springframework.security=INFO

server.port=8080